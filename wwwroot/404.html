<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>

    <script>
        // GitHub Pages では存在しないパスにアクセスすると 404.html が返るが、
        // SPA のルーティング (例: /about, /skills) を成立させるため、
        // ここから Blazor アプリを起動して Router にルートを解決させる。
        (function () {
            var isGhPages = window.location.hostname.endsWith('github.io');
            if (isGhPages) {
                var firstSegment = window.location.pathname.split('/')[1] || '';
                document.write('<base href="/' + firstSegment + '/">');
            } else {
                document.write('<base href="/">');
            }
        })();
    </script>
    <link rel="preload" href="_framework/blazor.webassembly.js" as="script" />
    <link rel="preload" href="_framework/dotnet.js" as="script" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="blazor-portfolio.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
